<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Agendar Tarefas</title>
</head>
<body>
<div class="container">
    <h1 class="center">Tarefas</h1>
    <p class="center">Organizando seu dia!!</p>

    <ul class="center" style="list-style: none;">
        <li>
            <i class="Small material-icons">event_note</i>
            Tarefa Importantes!!
        </li>
        <li>Não esqueça !!!</li>
    </ul>

    <p>Título: </p>
    <input type="text" class="campoTitulo" />
    
    <p>Observações: </p> 
    <input type="text" class="campoObs" />

    <p>Prioridade: </p>
    <select class="campoPrioridade">
        <option value="" disabled selected>Selecione a prioridade</option>
        <option value="Baixa">Baixa</option>
        <option value="Média">Média</option>
        <option value="Alta">Alta</option>
    </select>

    <div class="divBotao">
        <button id="botao">Adicionar Tarefa</button>
    </div>

    <!-- Mensagem solicitada -->
    <p id="mensagem" style="font-weight: bold; margin-top: 15px;"></p>

    <section class="tarefas">
        <table>
            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Observações</th>
                    <th>Prioridade</th>
                    <th>Concluir</th>
                    <th>Apagar</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>

    <!-- Scripts (jQuery, Materialize JS e seu main.js) -->
    <script src="js/jquery-3.5.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/main.js"></script>
</div>
</body>
</html>
